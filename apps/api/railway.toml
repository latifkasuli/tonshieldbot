# Railway service config for the TON Shield API.
#
# Pointed at via Railway's "Config-as-Code Path" service setting:
#     /apps/api/railway.toml
#
# The Railway service's "Root Directory" should remain the repo root so the
# pnpm workspace install resolves correctly. Railpack auto-detects pnpm from
# `packageManager` in the root package.json and Node 24 from `engines.node`.

[build]
builder = "RAILPACK"
# Compile the app to a single ESM bundle. `start` then runs
# `node --enable-source-maps dist/index.js` (per the app's `start`
# script in package.json) — no `tsx` at runtime, faster cold start.
buildCommand = "pnpm --filter @tonshield/api build"

[deploy]
preDeployCommand = ["pnpm --filter @tonshield/storage migrate:apply"]
startCommand = "pnpm --filter @tonshield/api start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
